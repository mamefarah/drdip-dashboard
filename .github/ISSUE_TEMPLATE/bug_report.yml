name: Bug report
description: Report a reproducible dashboard, data, proxy, or deployment problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include API tokens, beneficiary PII, or sensitive vulnerability details. Use SECURITY.md for security reports.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use sanitized example data if the data shape is relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, Node.js version, deployment platform, or other relevant context
  - type: textarea
    id: extra
    attributes:
      label: Additional context
